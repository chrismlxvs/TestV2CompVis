robot:
  # Chassis dimensions (length/X, width/Y, height/Z)
  chassis_size: [0.4, 0.3, 0.15]
  chassis_mass: 5.0
  
  # Drive system (4-Wheel Skid-Steer)
  wheel_radius: 0.08
  wheel_base: 0.35      # distance between left and right wheels along Y
  wheel_offset_x: 0.15  # distance from chassis center to front/rear axles along X
  wheel_mass: 0.5
  
  # Starting pose in world frame
  initial_position: [0.0, 0.0, 0.2]
  initial_orientation: [0.0, 0.0, 0.0]  # Euler Roll, Pitch, Yaw

  # Motion limits: keep linear speed moderate for stable camera/LiDAR,
  # but allow faster turning for quicker room coverage.
  max_linear_velocity: 1.5   # m/s
  max_angular_velocity: 4.0  # rad/s
  velocity_smoothing: 0.45   # higher = snappier response
  brake_smoothing: 0.65      # how quickly the robot stops when keys are released
  wheel_motor_force: 80.0
  wheel_lateral_friction: 1.2
  chassis_linear_damping: 0.02
  chassis_angular_damping: 0.08
